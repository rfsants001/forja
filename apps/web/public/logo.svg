<svg width="560" height="160" viewBox="0 0 560 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Forja">
  <defs>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161d"/>
      <stop offset="1" stop-color="#0e0f13"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="559" height="159" rx="28" fill="url(#bg)" stroke="#2d3240"/>

  <!-- flame mark -->
  <g transform="translate(44 36) scale(1.35)" filter="url(#glow)">
    <path fill="url(#flame)" d="M33 8c2 7-3 10-6 14-2.8 3.7-5 7-5 12a14 14 0 0 0 28 .5c0-5.5-2.8-9.7-5.2-13C37 18 36 13 33 8Z"/>
    <path fill="#0e0f13" opacity="0.55" d="M32 30c1.5 3-1.5 4.5-1.5 7.5A4.5 4.5 0 0 0 36 40c1.2-2 .4-4-1-6-1-1.5-2-2.6-3-4Z"/>
  </g>

  <!-- wordmark -->
  <text x="150" y="92" font-family="'Barlow Condensed','Arial Narrow',system-ui,sans-serif" font-weight="700" font-size="76" letter-spacing="2" fill="#f2f4f8">FOR<tspan fill="#ffb020">JA</tspan></text>

  <!-- tagline -->
  <text x="152" y="124" font-family="'Inter',system-ui,sans-serif" font-weight="600" font-size="15" letter-spacing="3" fill="#7a8599">LOCAL-FIRST WORKOUT TRACKER</text>
</svg>
